<title>CFOP Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: herramienta de tres vistas (Casos · Practicar · Notación). La ruta de 4 etapas va arriba como resumen;
   el color lo ponen las pegatinas del cubo, la interfaz se queda en pizarra fría con un solo acento cobalto. */
:root {
  --bg: #eceff4; --surface: #ffffff; --surface-2: #f4f6fa; --ink: #131926; --ink-2: #505b6e; --line: #d3d9e4;
  --accent: #1b4fd6; --accent-ink: #ffffff; --accent-soft: #e2e9fb;
  --ok: #1c8048; --ok-soft: #dff2e6; --warn: #a96a08; --warn-soft: #fbeed3; --bad: #bf342c; --bad-soft: #fbe3e0;
  --cu-U: #f6d21c; --cu-D: #f3f3ee; --cu-F: #1ea34a; --cu-R: #f1851a; --cu-B: #1d5fd8; --cu-L: #d62c2c;
  --guia: #6d38d6; --guia-soft: #eee6fd;
  --lcd: #aebba3; --lcd-ink: #1b2219; --pop-shadow: none;
  --marca-ink: #1a1d24; --marca-img: none; --marca-txt: ""; --marca-fs: .36;
  --plastic: #14161b; --cell-off: #c5ccd8; --cell-unk: #dfe3ea; --arrow: #10131a; --stage: #e2e6ee;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1219; --surface: #171b25; --surface-2: #1d222e; --ink: #e8ebf2; --ink-2: #9aa5b8; --line: #2b3242;
  --accent: #7da2ff; --accent-ink: #0b1124; --accent-soft: #1c2947;
  --ok: #58c486; --ok-soft: #153324; --warn: #e3ad4b; --warn-soft: #3a2c10; --bad: #f0857c; --bad-soft: #3d1c19;
  --cu-U: #f2cd14; --cu-D: #ecece6; --cu-F: #23a850; --cu-R: #f0821a; --cu-B: #2a6be6; --cu-L: #d93232;
  --plastic: #06070a; --cell-off: #3a4354; --cell-unk: #262d3a; --arrow: #10131a; --stage: #222836; --guia: #c3a6ff; --guia-soft: #2b2146;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1219; --surface: #171b25; --surface-2: #1d222e; --ink: #e8ebf2; --ink-2: #9aa5b8; --line: #2b3242;
  --accent: #7da2ff; --accent-ink: #0b1124; --accent-soft: #1c2947;
  --ok: #58c486; --ok-soft: #153324; --warn: #e3ad4b; --warn-soft: #3a2c10; --bad: #f0857c; --bad-soft: #3d1c19;
  --cu-U: #f2cd14; --cu-D: #ecece6; --cu-F: #23a850; --cu-R: #f0821a; --cu-B: #2a6be6; --cu-L: #d93232;
  --plastic: #06070a; --cell-off: #3a4354; --cell-unk: #262d3a; --arrow: #10131a; --stage: #222836; --guia: #c3a6ff; --guia-soft: #2b2146;
  color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 22px; }
.mono { font-family: var(--f-mono); }
.eyebrow { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.15; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 16px; }

.vista { display: grid; gap: 18px; min-width: 0; }
#lista { gap: 24px; }

/* Cabecera */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: -.01em; }
.logo { display: grid; grid-template-columns: repeat(3, 8px); gap: 2px; padding: 3px; background: var(--plastic); border-radius: 5px; }
.logo i { width: 8px; height: 8px; border-radius: 1.5px; background: var(--cu-U); }
.logo i:nth-child(1), .logo i:nth-child(6), .logo i:nth-child(8) { background: var(--cell-off); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 600; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.sync { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); }
.sync[data-s="cloud"]::before { background: var(--ok); }
.sync[data-s="saving"]::before { background: var(--warn); }

/* Ruta de etapas */
.ruta { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.ruta-sec { display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: 12px; border-radius: calc(var(--r) + 4px); border: 1px solid var(--line); background: var(--surface-2); }
.ruta-sec[data-k="b"] { border-top: 3px solid var(--ok); }
.ruta-sec[data-k="f"] { border-top: 3px solid var(--accent); }
.ruta-h { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding-inline: 2px; }
.ruta-tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.ruta-sec[data-k="b"] .ruta-tag { background: var(--ok-soft); color: var(--ok); }
.ruta-sec[data-k="f"] .ruta-tag { background: var(--accent-soft); color: var(--accent); }
.ruta-d { font-size: 12.5px; color: var(--ink-2); }
.ruta-cnt { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ruta-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.etapa { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.etapa[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.etapa b { font-family: var(--f-display); font-weight: 800; font-size: 16.5px; line-height: 1.15; }
.etapa .cnt { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
.meter span { display: block; height: 100%; }
.meter .m-ok { background: var(--ok); } .meter .m-warn { background: var(--warn); }
.como { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.como p { max-width: 78ch; color: var(--ink-2); }
.como p strong { color: var(--ink); font-weight: 600; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.leyenda { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); vertical-align: baseline; margin-right: 5px; }
.dot[data-s="1"] { background: var(--warn); border-color: var(--warn); }
.dot[data-s="2"] { background: var(--ok); border-color: var(--ok); }

/* Grupos y tarjetas de casos */
.grupo { display: grid; gap: 10px; }
.grupo-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding-top: 4px; }
.grupo-h p { color: var(--ink-2); font-size: 13.5px; }
.casos { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
.caso { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: 60px minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 6px 10px; align-items: start; min-width: 0; }
.caso:hover { border-color: var(--ink-2); }
.caso svg { width: 60px; height: 60px; display: block; }
.caso .nm { font-family: var(--f-display); font-weight: 800; font-size: 16px; line-height: 1.1; padding-right: 14px; }
.caso .ap { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.caso .alg { grid-column: 1 / -1; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; color: var(--ink-2); overflow-wrap: anywhere; }
.caso .dot { position: absolute; top: 12px; right: 10px; margin: 0; }

/* Insignia: algoritmo de las guías impresas */
.guia { display: inline-block; font-family: var(--f-body); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; background: var(--guia-soft); color: var(--guia); vertical-align: middle; white-space: nowrap; line-height: 1.6; }
.caso .nm .guia { margin-top: 4px; display: table; }
.eb-guia { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.alt .guia { margin-left: auto; flex: none; }
.quien .guia, .dorso .guia { margin: 0; }
:root[data-estilo="crono"] { --guia: #c3a6ff; --guia-soft: #2b2146; }

/* Diagramas */
.dg .u { fill: var(--cu-U); } .dg .off { fill: var(--cell-off); } .dg .unk { fill: var(--cell-unk); stroke: var(--cell-off); stroke-width: 1; stroke-dasharray: 2 2; }
.dg .cR { fill: var(--cu-R); } .dg .cL { fill: var(--cu-L); } .dg .cF { fill: var(--cu-F); } .dg .cB { fill: var(--cu-B); } .dg .cU { fill: var(--cu-U); } .dg .cD { fill: var(--cu-D); }
.dg .bg { fill: var(--plastic); } .dg .cX { fill: var(--cell-off); }
.dg .ar { stroke: var(--arrow); stroke-width: 2.2; stroke-linecap: round; fill: none; } .dg .ah { fill: var(--arrow); }

/* Cubo 3D */
.escena { background: var(--stage); border-radius: var(--r); display: grid; place-items: center; padding: 8px; }
.c3d { --s: 50px; position: relative; width: min(100%, 290px); aspect-ratio: 1; perspective: calc(var(--s) * 13); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.c3d:active { cursor: grabbing; }
.c3d-rot { position: absolute; left: 50%; top: 46%; width: 0; height: 0; transform-style: preserve-3d; }
.c3d-frente { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: calc(var(--s) * .07); padding-left: .12em; white-space: nowrap; pointer-events: none;
  font: 800 calc(var(--s) * .38) / 1 var(--f-display); letter-spacing: .12em; color: var(--ink); opacity: .85; transform-origin: 0 0;
  transform: translate3d(0, calc(var(--s) * 1.5), calc(var(--s) * 1.78)) rotateX(90deg) translate(-50%, 0); }
.c3d-frente::before { content: ""; width: 0; height: 0; border-left: calc(var(--s) * .24) solid transparent; border-right: calc(var(--s) * .24) solid transparent; border-bottom: calc(var(--s) * .28) solid currentColor; }
.cubie { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.cf { position: absolute; width: var(--s); height: var(--s); left: calc(var(--s) / -2); top: calc(var(--s) / -2); background: var(--plastic); backface-visibility: hidden; }
.cf::after { content: ""; position: absolute; inset: 5.5%; border-radius: 13%; background: transparent; }
.cf[data-c]::after { background-image: linear-gradient(140deg, rgba(255,255,255,.2), rgba(255,255,255,0) 45%, rgba(0,0,0,.1)); }
.cf[data-c="U"]::after { background-color: var(--cu-U); } .cf[data-c="D"]::after { background-color: var(--cu-D); }
.cf[data-c="F"]::after { background-color: var(--cu-F); } .cf[data-c="B"]::after { background-color: var(--cu-B); }
.cf[data-c="R"]::after { background-color: var(--cu-R); } .cf[data-c="L"]::after { background-color: var(--cu-L); }
.cf[data-c="X"]::after { background-color: var(--cell-off); background-image: none; }
.c3d.blanca .cf[data-c="U"]::after { background-color: var(--cu-D); } .c3d.blanca .cf[data-c="D"]::after { background-color: var(--cu-U); }
.c3d.blanca .cf[data-c="R"]::after { background-color: var(--cu-L); } .c3d.blanca .cf[data-c="L"]::after { background-color: var(--cu-R); }
.cf.marca::before { content: var(--marca-txt); position: absolute; inset: 15%; z-index: 1; display: grid; place-items: center; overflow: hidden; white-space: nowrap;
  background: var(--marca-img) center / contain no-repeat; color: var(--marca-ink); font: 800 calc(var(--s) * var(--marca-fs)) / 1 var(--f-display); letter-spacing: -.02em; transform: rotate(var(--mr, 0deg)); }
.cf-F { transform: translateZ(calc(var(--s) / 2)); } .cf-B { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.cf-R { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); } .cf-L { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.cf-U { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); } .cf-D { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.bajo-cubo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); }

/* Botones */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; }
.btn:hover { border-color: var(--ink-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 5px 10px; min-height: 30px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.lbls { display: grid; justify-items: center; } .lbls > span { grid-area: 1 / 1; visibility: hidden; white-space: nowrap; } .lbls > span.on { visibility: visible; }
.ic { display: inline-flex; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: .75; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctrl select, .campo select, .campo input[type="text"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 38px; min-width: 0; }

/* Algoritmo con movimientos */
.algo { font-family: var(--f-mono); font-size: 19px; font-weight: 600; line-height: 1.9; display: flex; flex-wrap: wrap; gap: 2px 7px; align-items: baseline; }
.algo .trg { display: inline-flex; gap: 7px; padding: 0 5px; margin: 0 -1px; border-bottom: 2px solid var(--accent); border-radius: 4px 4px 0 0; background: var(--accent-soft); }
.algo .mv { border-radius: 4px; padding: 0 2px; }
.algo .mv.on { background: var(--ink); color: var(--bg); }
.algo .mv.hecho { color: var(--ink-2); }
.algo .auf { color: var(--ink-2); font-weight: 400; }
.nota { font-size: 13px; color: var(--ink-2); }
/* Movimientos con nombre */
.algo.con-nombres { row-gap: .75em; padding-bottom: max(15px, .52em); }
.algo.con-grupos:has(.grp-trg) { padding-bottom: max(15px, .52em); }
.algo .trg, .algo .grp-trg { position: relative; }
.algo .trg-n { position: absolute; left: 50%; top: calc(100% + 2px); transform: translateX(-50%); font-family: var(--f-body); font-size: max(10.5px, .36em); font-weight: 600; line-height: 1.2; color: var(--accent); white-space: nowrap; pointer-events: none; letter-spacing: .01em; }
.algo .grp-trg { margin-bottom: .7em; }
.algo .grp-trg .trg-n { top: calc(100% + 3px); }
.trig-lista { display: grid; gap: 6px; }
.trig-fila { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) auto; gap: 6px; align-items: center; }
.trig-fila input { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-height: 34px; min-width: 0; font-size: 13px; }
.trig-fila input.mono { font-family: var(--f-mono); }
.trig-msg { grid-column: 1 / -1; margin: -2px 0 2px; font-size: 12px; }
.trig-msg:empty { display: none; }
#ajustes .check { color: var(--ink); font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
/* Secciones propias */
.algo.con-grupos { gap: 8px 10px; }
.algo .grp { display: inline-flex; align-items: baseline; gap: .32em; padding: .05em .4em .05em .3em; border: 1.5px solid var(--line); border-radius: .3em; background: var(--surface); cursor: pointer; }
.algo .grp::before { content: attr(data-n); font-family: var(--f-body); font-size: .42em; font-weight: 700; color: var(--accent); align-self: flex-start; margin-top: .35em; }
.algo .grp:hover { border-color: var(--accent); }
.revela .algo .grp, .dorso .algo .grp { cursor: pointer; }
.dorso .algo .grp { cursor: default; }
.algo.editando { gap: 0; align-items: center; }
.algo.editando .mv { padding: 0 2px; }
.corte { width: 22px; align-self: stretch; min-height: 1.6em; border: 0; background: none; position: relative; padding: 0; margin: 0 1px; border-radius: 4px; }
.corte::after { content: ""; position: absolute; left: 50%; top: 18%; bottom: 18%; border-left: 2px dashed var(--line); transform: translateX(-1px); }
.corte:hover::after { border-left-color: var(--ink-2); }
.corte.on::after { border-left: 3px solid var(--accent); top: 6%; bottom: 6%; }
.corte:hover { background: var(--accent-soft); }
.eb-fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Detalle */
dialog#detalle { border: 0; padding: 0; margin: 0 0 0 auto; width: min(470px, 100%); max-width: 100%; height: 100%; max-height: 100%; background: var(--surface); color: var(--ink); box-shadow: -12px 0 40px rgba(0,0,0,.25); }
dialog#detalle::backdrop { background: rgba(8, 10, 16, .5); }
.det-play, .det-info { display: grid; gap: 16px; align-content: start; min-width: 0; }
.teclas-hint { display: none; }
.det { display: grid; gap: 16px; padding: 18px 20px 28px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.det-h { display: flex; align-items: flex-start; gap: 12px; }
.det-h svg.dg { width: 64px; height: 64px; flex: none; }
.det-h h2 { font-size: 26px; }
.det-h .x { margin-left: auto; }
.bloque { display: grid; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 6px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"][data-s="0"] { background: var(--ink); color: var(--bg); }
.seg button[aria-pressed="true"][data-s="1"] { background: var(--warn-soft); color: var(--warn); }
.seg button[aria-pressed="true"][data-s="2"] { background: var(--ok-soft); color: var(--ok); }
.datos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.datos div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.datos dt { font-size: 11.5px; color: var(--ink-2); }
.datos dd { margin: 0; font-family: var(--f-mono); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
dl { margin: 0; }
.alts { display: grid; gap: 6px; }
.alt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); text-align: left; font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }
.alt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.alt i { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink-2); }

.msg { font-size: 13px; } .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }

/* Mi cubo */
dialog#ajustes { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px); background: var(--surface); color: var(--ink); }

.aj { display: grid; gap: 14px; padding: 18px 20px 22px; }

.marca-b[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.marca-b i { width: 34px; height: 34px; border-radius: 6px; border: 2px solid var(--plastic); background: var(--cu-D) center / 68% no-repeat; display: grid; place-items: center; font: 800 12px/1 var(--f-display); font-style: normal; color: var(--marca-ink); overflow: hidden; }
.aj input[type="file"] { max-width: 100%; font-size: 13px; }

/* Practicar */
.pr-top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
.pr-top label { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.pr-top select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 38px; color: var(--ink); max-width: 100%; }
.check { display: flex !important; grid-auto-flow: column; align-items: center; gap: 8px !important; min-height: 38px; color: var(--ink) !important; font-size: 14px !important; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.pasos { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--ink-2); padding: 0; margin: 0; list-style-position: inside; }
.pr { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.pr-izq { display: grid; gap: 8px; align-content: start; }
.pr-der { display: grid; gap: 14px; align-content: start; min-width: 0; }
.mezcla { font-family: var(--f-mono); font-size: 21px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.crono { font-family: var(--f-mono); font-weight: 600; font-size: clamp(54px, 11vw, 92px); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; padding: 6px 0; }
.crono[data-f="running"] { color: var(--accent); }
.acc { display: flex; flex-wrap: wrap; gap: 8px; }
.revela { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.revela .quien { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.revela .quien b { font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.eval { display: grid; gap: 8px; }
.eval .acc .btn { flex: 1 1 130px; }
.btn.e-ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.btn.e-warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.btn.e-bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.vacio { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 26px 20px; display: grid; gap: 10px; justify-items: start; }
.sesion { display: grid; gap: 8px; }
.sesion ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sesion li { display: grid; grid-template-columns: minmax(0, 1fr) 70px 110px; gap: 10px; align-items: center; padding: 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; }
.sesion li span:nth-child(2) { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.pill { justify-self: end; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill[data-r="0"] { background: var(--ok-soft); color: var(--ok); } .pill[data-r="1"] { background: var(--warn-soft); color: var(--warn); } .pill[data-r="2"] { background: var(--bad-soft); color: var(--bad); }


/* Tarjetas */
.fc { display: grid; gap: 14px; justify-items: center; }
.flash { width: min(100%, 460px); border: 0; padding: 0; background: none; perspective: 1400px; text-align: center; border-radius: 18px; }
.flash-in { display: grid; transition: transform .5s cubic-bezier(.3,.1,.3,1); transform-style: preserve-3d; }
.flash.vuelta .flash-in { transform: rotateY(180deg); }
.cara { grid-area: 1 / 1; -webkit-backface-visibility: hidden; backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; display: grid; gap: 12px; justify-items: center; align-content: center; min-height: 390px; box-shadow: 0 12px 34px rgba(10, 14, 24, .10); min-width: 0; }

.dorso h2 { font-size: 30px; }
.dorso .algo { justify-content: center; font-size: 22px; }
.fc-dg svg { width: min(64vw, 250px); height: auto; display: block; }
.fc-dg { transition: none; }
.fc-pos { display: flex; align-items: center; gap: 12px; text-align: left; max-width: 340px; }
.fc-mini svg { width: 64px; height: 64px; display: block; }
.fc-acc { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.fc-ses { text-align: center; }
@media (prefers-reduced-motion: reduce) { .flash-in { transition: none; } }

/* Notación */
.not { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.not-izq { display: grid; gap: 8px; position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

.teclas { display: flex; flex-wrap: wrap; gap: 6px; }
.tecla { width: 46px; height: 42px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--f-mono); font-weight: 600; font-size: 16px; }
.tecla:hover { border-color: var(--ink-2); }
.fam { display: grid; gap: 6px; }
.fam p { color: var(--ink-2); font-size: 13.5px; max-width: 70ch; }
.gat { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }

@media (max-width: 860px) {

}
@media (max-width: 520px) {

  .tabs { width: 100%; } .tab { flex: 1; padding-inline: 8px; }

  .ruta-sec { padding: 10px; } .ruta-g { gap: 8px; } .ruta-d { order: 3; width: 100%; } .ruta-cnt { font-size: 12px; }
  .casos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .caso { grid-template-columns: 52px minmax(0, 1fr); padding: 10px; } .caso svg { width: 52px; height: 52px; }
  .pr { padding: 14px; } .mezcla { font-size: 18px; } .algo { font-size: 17px; }
  .sesion li { grid-template-columns: minmax(0, 1fr) 60px 100px; }
  dialog#detalle { width: 100%; }
  .cara { min-height: 300px; padding: 18px 14px; } .fc-dg svg { width: min(58vw, 210px); } .dorso h2 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

/* Escritorio: el detalle pasa a ventana amplia; la reproducción ocupa la columna grande y queda fija */
@media (min-width: 861px) {
  dialog#detalle { margin: auto; width: min(1220px, calc(100% - 32px)); height: calc(100% - 32px); max-height: calc(100% - 32px); border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,.4); }
  .det { grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr); grid-template-areas: "play head" "play info"; grid-template-rows: auto 1fr; gap: 18px 26px; padding: 20px 24px; align-items: start; }
  .det > .det-h { grid-area: head; } .det-play { grid-area: play; } .det-info { grid-area: info; }
  .det-play { position: sticky; top: 0; height: calc(100vh - 72px); min-height: 460px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

}

.estilo-b { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }

}

/* ===== Estilo: Juguete pop (bordes gruesos, sombras duras, tarjetas grandes) ===== */

/* ===== Estilo: Minimal compacto (denso; casos en lista; pestañas subrayadas) ===== */
:root[data-estilo="mini"] {
